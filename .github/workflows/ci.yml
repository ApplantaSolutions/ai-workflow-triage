name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint (ruff)
        run: ruff check .

      - name: Format check (ruff)
        run: ruff format --check .

      - name: Tests
        run: pytest

      - name: Committed audit examples are byte-stable
        run: python scripts/build_examples.py --check

      - name: Secret scan (regex)
        run: python scripts/scan_secrets.py

      - name: Secret scan (detect-secrets against the audited baseline)
        run: git ls-files -z | xargs -0 detect-secrets-hook --baseline .secrets.baseline
