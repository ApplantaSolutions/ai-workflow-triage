[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ai-workflow-triage"
version = "1.0.0"
description = "AI-assisted inbound-request triage: the model interprets the message, a deterministic rule engine authorizes the routing, escalation, and human-review decision, and every decision is auditable."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Rudolph Miller" }]
keywords = ["ai", "triage", "routing", "workflow", "automation", "llm", "deterministic-rules"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Intended Audience :: Developers",
    "Topic :: Office/Business",
]
dependencies = [
    "pydantic>=2.6,<3",
]

[project.scripts]
triage = "ai_workflow_triage.cli:main"

[project.optional-dependencies]
# The recruiter-facing web UI. Pure-Python, small; still no live LLM.
web = [
    "fastapi>=0.110",
    "jinja2>=3.1",
    "uvicorn>=0.27",
    "python-multipart>=0.0.9",
]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "httpx>=0.27",
    "fastapi>=0.110",
    "jinja2>=3.1",
    "uvicorn>=0.27",
    "python-multipart>=0.0.9",
    "detect-secrets>=1.5",
]
# The real provider. Never imported by tests or the offline demo.
real = [
    "anthropic>=0.40",
]

[tool.hatch.build.targets.wheel]
packages = ["src/ai_workflow_triage"]
# Non-Python package data: the scenario set and the web templates.
artifacts = [
    "src/ai_workflow_triage/data/*.json",
    "src/ai_workflow_triage/web/templates/*.html",
    "src/ai_workflow_triage/web/static/*.css",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "W"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = [
    # third-party deprecation noise from starlette's TestClient + anyio; not our code
    "ignore::DeprecationWarning:starlette.testclient",
    "ignore:Using `httpx` with `starlette.testclient`",
    "ignore:The anyio.abc.BlockingPortal alias is deprecated",
]
